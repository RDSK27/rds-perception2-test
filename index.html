<script>
if('serviceWorker' in navigator){
  var swReg=null, swReloaded=false;
  var swHadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!swHadController || swReloaded) return;
    swReloaded=true; window.location.reload();
  });
  window.addEventListener('load', function(){
    /* sw.js?v=<app-ver>: convencion de la suite, cada version es una peticion de red distinta */
    var verEl=document.querySelector('.app-ver');
    var swUrl='sw.js?v='+encodeURIComponent(verEl?verEl.textContent.trim():Date.now());
    navigator.serviceWorker.register(swUrl, {updateViaCache:'none'}).then(function(reg){
      swReg=reg;
      reg.update();
      if(reg.waiting && navigator.serviceWorker.controller){ reg.waiting.postMessage({action:'skipWaiting'}); }
      reg.addEventListener('updatefound', function(){
        var nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            nw.postMessage({action:'skipWaiting'});
          }
        });
      });
    }).catch(function(){});
  });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && swReg){ swReg.update(); }
  });
}
</script>

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#000000;overscroll-behavior:none;}
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:transparent;
    color:var(--negro);
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overscroll-behavior:none;
  }
  /* El bloqueo de scroll se hace en .app (no en html/body) para que iOS pueda
     desplazar el campo INI sobre el teclado en modo standalone (PWA). */
  .app{overflow:hidden;}
  body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background:#000000;z-index:-2;pointer-events:none;}
  body::after{content:"";position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:560px;max-width:100%;background:#FFFFFF;z-index:-1;pointer-events:none;}
  body.home-active::after{background:#b0b4b8;}
  .app{position:relative;max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#FFFFFF;}

  /* iOS/iPad: el body tiene user-select:none (bueno para botones/juego), pero eso
     impide el foco/teclado en los campos. Se reactiva solo en inputs y selects. */
  input,select,textarea{-webkit-user-select:text;user-select:text;}

  /* ---------- Header ---------- */
  header{ width:100%; flex-shrink:0; background:#000000; border-bottom:4px solid #b03020; display:flex; flex-direction:column; align-items:center; padding:0; padding-top:env(safe-area-inset-top,0px); }
  header img{ width:100%; height:auto; display:block; margin-bottom:0; }
  .subtitle{ display:block; width:100%; box-sizing:border-box; font-size:0.58rem; letter-spacing:0.14em; color:#cfcfcf; text-transform:none; padding:8px 0 8px; text-align:center; background:#000000; }

  /* ---------- Cuerpo ---------- */
  main{flex:1;padding:8px 16px 4px;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;}

  .title{
    text-align:center;font-weight:900;letter-spacing:0.08em;line-height:1;
    font-size:2rem;color:var(--negro);text-transform:uppercase;
    margin:0;
  }

  .logo-wrap{display:flex;justify-content:center;padding:0;}
  .logo-wrap img{width:110px;width:min(30vw,110px,13svh);height:auto;display:block;margin:0 auto 2px;}

  .group-label{
    text-align:center;color:var(--tx-gris);font-weight:700;
    letter-spacing:5px;font-size:11px;text-transform:uppercase;margin:0;
  }

  .segment{
    display:flex;border-top:4px solid #b03020;background:#111;
  }
  .segment button{
    flex:1;border:0;background:transparent;color:#fff;
    font-family:inherit;font-weight:900;letter-spacing:1px;text-transform:uppercase;
    font-size:12px;height:36px;padding:0 4px;cursor:pointer;position:relative;
    border-right:3px solid #666;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;
    text-shadow:0 1px 2px rgba(0,0,0,0.7);
  }
  .segment button:last-child{border-right:0;}
  .segment button.sel{background:var(--rojo);color:#fff;text-shadow:none;}
  #segEstimulo,#segEnsayos{margin-top:0;}

  /* ---------- Acciones (mas pequenas y estrechas, como en la referencia) ---------- */
  .actions{display:flex;flex-direction:column;align-items:center;gap:6px;gap:clamp(4px,1svh,8px);margin-top:clamp(20px,4svh,40px);}

  .btn-ranking { width:75%; padding:9px; background:#fff; color:#b03020; border:2px solid #b03020; font-size:0.78rem; font-weight:900; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer; text-align:center; border-radius:6px; transition:transform 0.12s; margin-top:0; }
  .btn-ranking:active{transform:translateY(3px);}

  .home-btn-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:15px; }
  .home-btn-row #btn-start-wrap{ margin:0; }
  .app-ver{ margin-top:auto; text-align:center; color:#9a9a9a; font-size:0.72rem; letter-spacing:0.12em; font-family:Arial,sans-serif; padding-top:6px; }
  .pending-sync{ display:none; margin-top:4px; text-align:center; color:#e0a030; font-size:0.68rem; letter-spacing:0.03em; font-family:Arial,sans-serif; }
  .start-wrap{ display:flex; width:fit-content; align-items:center; justify-content:center; padding:4px; border-radius:50%; background:conic-gradient(#ffffff,#9a9a9a,#e8e8e8,#5a5a5a,#ffffff,#8a8a8a,#dcdcdc,#666666,#ffffff); box-shadow:0 5px 12px rgba(0,0,0,0.6); transition:transform 0.08s, box-shadow 0.08s; }
  .start-wrap:active{ transform:translateY(3px); box-shadow:0 2px 6px rgba(0,0,0,0.6); }
  .start-btn{ width:70px; height:70px; border-radius:50%; border:none; cursor:pointer; box-shadow:inset 0 2px 4px rgba(255,255,255,0.28), inset 0 -3px 6px rgba(0,0,0,0.5); }
  .start-btn.rank-btn{ background:radial-gradient(circle at 35% 30%, #ffffff 0%, #ececec 45%, #c6c6c6 100%); display:flex; align-items:center; justify-content:center; padding:0; }
  .start-btn.rank-btn svg{ display:block; }


  footer{
    text-align:center;color:var(--tx-gris);font-weight:600;letter-spacing:2px;
    font-size:10px;text-transform:uppercase;padding:6px 12px 10px;
  }

  /* ===== Multi-pantalla ===== */
  .screen{flex:1;display:none;flex-direction:column;min-height:0;}
  .screen.active{display:flex;}

  /* Fondo metalizado (acero cepillado) SOLO en la pantalla de inicio.
     Va en el <main> del home (no en #home) porque main{background:#fff} lo taparia. */
  #home>main{
    background-color:#c4c8cc;
    background-image:
      linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,0.38) 45%,rgba(255,255,255,0) 60%),
      radial-gradient(140% 90% at 50% 0%,rgba(255,255,255,0.35) 0%,rgba(255,255,255,0.10) 35%,rgba(255,255,255,0) 70%),
      linear-gradient(180deg,#e9ecef 0%,#c9cdd1 50%,#b0b4b8 100%);
  }

  /* Navbar inferior Inicio / Repetir */
  .navbar{display:flex;gap:8px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:#fff;}
  .nav-btn{flex:1;height:var(--ah);display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--rojo);color:#fff;border:0;border-radius:0;cursor:pointer;
    font-family:inherit;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:14px;}
  .nav-btn svg{width:18px;height:18px;}
  .results-actions { display:flex; flex-direction:row; gap:0; width:100%; z-index:10; border-top:4px solid #b03020; margin-top:0; }
  .game-ctrl-btn { flex:1; padding:13px; background:#111; color:#fff; border:1px solid #333; border-right:none; font-size:0.82rem; font-weight:900; letter-spacing:0.12em; cursor:pointer; text-transform:uppercase; display:flex; align-items:center; justify-content:center; }
  .game-ctrl-btn:last-child { border-right:1px solid #ddd; }

  /* ----- Ejercicio ----- */
  .game-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px 14px 11px;gap:7px;background:#fff;}
  .target-row{display:flex;align-items:center;justify-content:center;gap:14px;}
  .target-cap{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:12px;color:var(--azul);text-align:left;line-height:1.1;}
  .target-wrap{display:flex;justify-content:center;}
  .target-box{width:72px;height:72px;border:0;display:flex;align-items:center;justify-content:center;background:#fff;flex:none;}
  .target-box svg{width:86%;height:86%;}

  .stats{display:flex;gap:8px;}
  .stat{flex:1;text-align:center;padding:2px;background:#fff;}
  .stat .k{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:9px;color:#888;}
  .stat .v{font-weight:800;font-size:36px;line-height:1.05;color:var(--rojo);}
  .stat.main .v{color:var(--negro);}
  .substat{display:flex;justify-content:center;gap:16px;font-size:12px;color:#555;font-weight:600;}
  .substat b{color:var(--negro);}

  .prog-row{display:flex;align-items:center;gap:10px;}
  .trial-count{font-weight:800;font-size:15px;color:var(--negro);white-space:nowrap;min-width:44px;}
  .progress{flex:1;height:9px;background:var(--seg);border:2px solid var(--borde);}
  .progress > i{display:block;height:100%;background:var(--rojo);width:0%;transition:width .12s linear;}

  .grid-wrap{position:relative;flex:1;min-height:0;display:flex;padding:6px;box-sizing:border-box;}
  /* panel NEGRO con borde ROJO y esquinas redondeadas donde se colocan las teclas (como Reaction Trial); lado cuadrado fijado por JS (kbFit) */
  .grid{flex:none;margin:auto;width:min(100%,62vh);height:min(100%,62vh);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;touch-action:none;background:#000;border:4px solid #b03020;padding:10px;box-sizing:border-box;border-radius:18px;-webkit-user-select:none;user-select:none;}
  .key{position:relative;background:var(--keyimg) center/100% 100% no-repeat;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;}
  .key .lbl{position:absolute;left:15%;right:15%;top:9%;height:56%;display:flex;align-items:center;justify-content:center;color:#2a2118;font-weight:900;font-family:Arial,Helvetica,sans-serif;font-size:var(--kf,34px);line-height:1;pointer-events:none;}
  .key .lbl svg{width:78%;height:78%;display:block;}
  .key.on{filter:brightness(.74);transform:translateY(2px);}
  .sq-count{position:absolute;left:0;right:0;top:50%;margin-top:-70px;text-align:center;color:var(--rojo);font-weight:900;font-size:130px;line-height:1;-webkit-text-stroke:4px #fff;paint-order:stroke fill;pointer-events:none;z-index:5;}   /* rojo con borde blanco: se ve sobre blanco y sobre negro */
  .segment button[data-soon],.rank-tab[data-soon]{opacity:.38;cursor:default;}
  #segEstimulo button,#segEstR button{font-size:0.72rem;letter-spacing:0.04em;}   /* etiquetas largas: Números/Letras */
  .segment.off,.rank-tabs.off{opacity:.35;pointer-events:none;}   /* Limite: Numeros-Letras/Simbolos y 15/25/50 no aplican */

  /* Cuenta atras */
  .count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff;z-index:20;}
  .count.on{display:flex;}
  .count span{font-weight:800;font-size:120px;color:var(--rojo);}

  /* Resultado / fallo */
  .center-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;background:#fff;text-align:center;}
  .res-unit{font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:13px;color:var(--azul);}
  .res-main{font-weight:800;font-size:64px;color:var(--rojo);line-height:.9;}
  .res-grid{display:flex;gap:10px;}
  .res-card{border:2px solid var(--borde);padding:8px 12px;min-width:86px;}
  .res-card .v{font-weight:800;font-size:22px;color:var(--negro);}
  .res-card .k{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:10px;color:#888;}
  .fail-title{font-weight:800;font-size:46px;color:var(--rojo);text-transform:uppercase;line-height:.95;}
  .fail-msg{font-weight:600;font-size:16px;color:var(--negro);max-width:300px;}

  /* Ranking */
  .rank-body{flex:1;min-height:0;overflow-y:auto;padding:10px 14px;background:#fff;}
  .rank-title{text-align:center;font-weight:800;font-size:30px;text-transform:uppercase;margin-bottom:2px;}
  .rank-sub{text-align:center;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:12px;color:var(--rojo);margin-bottom:10px;}
  .rank-row{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--seg);}
  .rank-row .pos{font-weight:800;color:var(--rojo);text-align:center;}
  .rank-row .nm{font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .rank-row .av{font-weight:800;color:var(--negro);}
  .rank-row .tt{font-weight:600;color:#888;font-size:12px;}
  .rank-empty{text-align:center;color:#999;font-weight:600;padding:20px;}
  .cnum{font-weight:800;font-size:46px;color:var(--rojo);line-height:1;}
  .result-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 14px;background:#fff;text-align:center;}
  .res-chart{width:100%;}
  .res-chart svg{width:100%;height:auto;display:block;}
  .pos-wrap{display:none;flex-direction:column;align-items:center;gap:4px;padding:6px 16px 0;text-align:center;}
  .pos-circle{width:54px;height:54px;border-radius:50%;background:#000;color:#fff;font-weight:900;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .pos-txt{font-size:10px;font-weight:700;letter-spacing:0.04em;color:#555;}
  .save-row{display:flex;justify-content:center;padding:8px 16px 8px;}
  .save-row-inner{display:flex;align-items:stretch;justify-content:center;gap:8px;width:calc(60% + 92px);max-width:100%;}
  .btn-save{flex:1;max-width:60%;padding:7px;background:var(--rojo);color:#fff;border:none;border-radius:4px;font-family:inherit;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;font-size:0.65rem;cursor:pointer;}
  .btn-save:disabled{background:#9A9A9A;}
  .btn-rank2{flex:none;width:84px;padding:7px;background:#111;color:#fff;border:none;border-radius:4px;font-family:inherit;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;font-size:0.65rem;cursor:pointer;}
  .seg-sm button{font-size:12px;padding:7px 4px;letter-spacing:1px;}
  .rank-seg-label{text-align:center;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:10px;color:#999;margin:6px 0 3px;}
  .rank-screen-title { font-size:1.2rem; font-weight:900; letter-spacing:0.1em; text-transform:uppercase; color:#111; text-align:center; background:#fff; padding:9px 14px 7px; border-bottom:3px solid #b03020; margin-bottom:10px; }
  .rank-tabs { display:flex; margin-bottom:0; margin-top:0; }
  .rank-tab { flex:1; padding:5px 4px; font-size:0.58rem; letter-spacing:0.06em; text-align:center; cursor:pointer; color:#999; font-weight:700; text-transform:uppercase; background:#fff; border:1px solid #000; border-right:none; }
  .rank-tab:last-child { border-right:1px solid #000; }
  .rank-tab.sel { color:#fff; background:#b03020; border-color:#000; }
  .rank-full-list { background:#fff; }
  .rank-full-row { display:flex; align-items:center; gap:8px; padding:5px 14px; border-bottom:1px solid #f0f0f0; }
  .rank-full-row.rank-full-me { background:#fff2ee; box-shadow:inset 3px 0 0 #b03020; }
  .rank-full-row.rank-full-me .rank-full-name { color:#b03020; font-weight:900; }
  .rank-full-row.rank-full-me.me-grey { background:#f0f0f0; box-shadow:inset 3px 0 0 #9A9A9A; }
  .rank-full-row.rank-full-me.me-grey .rank-full-name { color:#555; }
  .rank-full-pos { font-size:0.72rem; font-weight:900; color:#555; width:22px; }
  .rank-full-pos.gold { color:#c9a227; }
  .rank-full-pos.silver { color:#8e9eab; }
  .rank-full-pos.bronze { color:#c07941; }
  .rank-full-name { flex:1; font-size:0.72rem; font-weight:700; color:#111; }
  .rank-full-ms { font-size:0.72rem; font-weight:900; color:#b03020; }
  .rank-full-date { font-size:0.5rem; color:#555; }
  .rank-full-empty { text-align:center; padding:24px; font-size:0.62rem; color:#ccc; letter-spacing:0.1em; }
  #segModoR,#segEstR,#segEnsR{margin-bottom:4px;}
  #rkList{margin-top:10px;}
  .res-quad{width:100%;height:clamp(200px,27svh,238px);display:grid;grid-template-columns:1.28fr 1fr;grid-template-rows:1.62fr 1fr;}
  .rq{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 8px;gap:2px;min-width:0;min-height:0;}
  .rq:nth-child(1){border-right:3px solid var(--rojo);border-bottom:3px solid var(--rojo);}
  .rq:nth-child(2){border-bottom:3px solid var(--rojo);}
  .rq:nth-child(3){border-right:3px solid var(--rojo);}
  .rq-k{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:10px;color:#9A9A9A;}
  .rq-v{font-weight:800;font-size:34px;line-height:1;color:var(--negro);}
  .rq-media .rq-main{font-weight:800;font-size:46px;line-height:1;color:var(--rojo);}
  @keyframes blinkop{0%,100%{opacity:1}50%{opacity:.2}}
  .blink{animation:blinkop .9s ease-in-out infinite;}
  .res-msg{font-weight:700;text-transform:none;letter-spacing:0.2px;font-size:13px;color:var(--rojo);text-align:center;}
  .res-ens{font-weight:700;font-size:15px;color:var(--negro);text-align:center;}
  .res-ens b{font-size:22px;color:var(--rojo);}
  #btn-start-wrap { display:flex; align-items:center; justify-content:center; padding:4px; margin:5px auto 3px; border-radius:50%; background:conic-gradient(#ffffff,#9a9a9a,#e8e8e8,#5a5a5a,#ffffff,#8a8a8a,#dcdcdc,#666666,#ffffff); box-shadow:0 5px 12px rgba(0,0,0,0.6); transition:transform 0.08s, box-shadow 0.08s; }
  #btn-start-wrap:active { transform:translateY(3px); box-shadow:0 2px 6px rgba(0,0,0,0.6); }
  #btn-start { width:70px; height:70px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #e84030 0%, #b03020 45%, #7a1a10 100%); border:none; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; font-weight:900; font-size:0.6rem; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer; position:relative; box-shadow:inset 0 2px 4px rgba(255,255,255,0.28), inset 0 -3px 6px rgba(0,0,0,0.5); transition:transform 0.08s; }
  #btn-start:active { box-shadow:inset 0 3px 7px rgba(0,0,0,0.6); }
  #user-name-bar { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 0 5px; box-sizing:border-box; gap:0; margin-top:31px; }

  /* Overlay "Ejercicio finalizado" (modal a pantalla completa, 1s antes de resultados) */
  #transition-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:#111; z-index:9999; align-items:center; justify-content:center; flex-direction:column; }
  #transition-overlay.active { display:flex; }
  #transition-text { color:#fff; font-size:1.6rem; font-weight:900; font-family:Arial,sans-serif; letter-spacing:0.05em; text-align:center; text-transform:uppercase; border-top:4px solid #b03020; border-bottom:4px solid #b03020; padding:16px 30px; }
</style>

<script>
"use strict";
function $(id){ return document.getElementById(id); }
function show(id){ if(id!=='ranking' && typeof stopRankWatch==='function') stopRankWatch(); var s=document.querySelectorAll('.screen'); for(var i=0;i<s.length;i++) s[i].classList.remove('active'); $(id).classList.add('active'); document.body.classList.toggle('home-active', id==='home'); }
function two(n){ return (n<10?'0':'')+n; }
function fmtTime(ms){ var cs=Math.floor(ms/10), cc=cs%100, s=Math.floor(cs/100), sec=s%60, m=Math.floor(s/60); return m+':'+two(sec)+'.'+two(cc); }
function fmtDate(ts){ if(!ts) return ''; var d=new Date(ts); return two(d.getDate())+'/'+two(d.getMonth()+1); }
function fmtRT(ms){ return (ms/1000).toFixed(2); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var AC=null;
function audioCtx(){
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }
  }catch(e){ AC=null; }
  return AC;
}
function tone(type,f0,f1,start,dur,vol){
  var ctx=AC; if(!ctx) return;
  var o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,start);
  if(f1){ o.frequency.exponentialRampToValueAtTime(f1,start+dur); }
  g.gain.setValueAtTime(0.0001,start);
  g.gain.exponentialRampToValueAtTime(vol,start+0.006);

    g.style.width=side+'px'; g.style.height=side+'px'; g.style.padding=pad+'px'; g.style.gap=gap+'px';
    g.style.gridTemplateColumns='repeat('+cols+',1fr)'; g.style.gridTemplateRows='repeat('+cols+',1fr)';

function kbDeal(){   /* n-1 valores distintos + 1 repetido (en el de numeros: falta uno y otro esta repetido) */

  else if(S.mode==='extremo'){ items=LETTERS.slice(); }

  vals=distinct.concat([dup]); shuffleArr(vals);

function calc(){

  for(var i=0;i<n;i++){ sum+=S.times[i]; if(S.times[i]<best) best=S.times[i]; if(S.times[i]>worst) worst=S.times[i]; }
  return {n:n, sum:sum, avg:n?sum/n:0, best:best===Infinity?0:best, worst:worst};
}

function renderChart(times){
  var box=$('resChart'); if(!box) return;
  var n=times.length; if(n===0){ box.innerHTML=''; return; }
  var W=320,H=132,padL=12,padR=12,padT=12,padB=22;
  var min=Math.min.apply(null,times), max=Math.max.apply(null,times), span=(max-min)||1;
  var pw=W-padL-padR, ph=H-padT-padB, base=padT+ph, i;
  function X(i){ return n===1?padL+pw/2:padL+(i/(n-1))*pw; }
  function Y(v){ return padT+(1-(v-min)/span)*ph; }
  var pts=[]; for(i=0;i<n;i++){ pts.push([X(i),Y(times[i])]); }
  var area='M '+pts[0][0].toFixed(1)+' '+base.toFixed(1);
  for(i=0;i<n;i++){ area+=' L '+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1); }
  area+=' L '+pts[n-1][0].toFixed(1)+' '+base.toFixed(1)+' Z';
  var poly=''; for(i=0;i<n;i++){ poly+=(i?' ':'')+pts[i][0].toFixed(1)+','+pts[i][1].toFixed(1); }
  var s='<svg viewBox="0 0 '+W+' '+H+'">';
  s+='<path d="'+area+'" fill="rgba(162,58,41,0.10)" stroke="none"/>';
  s+='<polyline points="'+poly+'" fill="none" stroke="#A23A29" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  var step=n<=12?1:5;
  for(i=0;i<n;i++){
    if(i===0||i===n-1||((i+1)%step)===0){
      s+='<text x="'+pts[i][0].toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-family="Arial" font-size="9" fill="#9A9A9A">'+(i+1)+'</text>';
    }
  }
  box.innerHTML=s+'</svg>';
}

/* Posicion de este resultado (2026-10-05): se calcula con la copia local del ranking (cache de esta combinacion + marcas
   pendientes de este dispositivo), sin ninguna lectura de Firestore. Cuenta solo la mejor marca de cada OTRA persona, igual que
   el ranking (que oculta repetidos). Sin copia guardada de la combinacion no se muestra nada. */
function updatePos(){
  var w=document.getElementById('posWrap'); if(!w) return;
  w.style.display='none';

    var g=loadRankCache(rankCacheKey(S.mode,S.stim,S.total)); if(!g) return;

    var rows=mergeRank(g,pendingOnly(loadLb(lbKey(S.mode,S.stim,S.total))));
    sortLb(rows,S.mode);
    var seen={}, out=[];
    rows.forEach(function(r){ var n=r.name||''; if(n===rec.name||seen[n]) return; seen[n]=1; out.push(r); });
    out.push(rec);
    sortLb(out,S.mode);
    var p=out.indexOf(rec)+1, e=document.getElementById('posNum');
    e.textContent=p; e.style.fontSize=p>=100?'16px':(p>=10?'22px':'26px');
    w.style.display='flex';
  }catch(e){}
}

function lbKey(mode,stim,total){ return 'rds_pc2_'+mode+'_'+stim+'_'+total; }

function sortLb(lb,mode){   /* Limite: mas cuadrados pulsados primero, desempate por reaccion media; Normal: reaccion media */
  if(mode==='limite'){ lb.sort(function(a,b){ return ((b.ensayos||0)-(a.ensayos||0))||(a.avg-b.avg); }); }

}

  var k=lbKey(S.mode,S.stim,S.total), lb=loadLb(k);

function renderRankList(list, el, m, latest){
  list=filterRepeated(list);
  function rankBetter(a,b){
    if(a==null) return false; if(b==null) return true;
    var av=(a.avg==null?9999:a.avg), bv=(b.avg==null?9999:b.avg);
    if(m==='limite'){
      var ae=(a.ensayos||0), be=(b.ensayos||0);
      return ae>be || (ae===be && av<bv);
    }
    return av<bv;
  }
  var medals=['gold','silver','bronze'];
  var meName=getHomeName();
  var myIdx=-1, myEntry=null;
  if(meName){
    for(var k=0;k<list.length;k++){
      if((list[k].name||'').trim().toUpperCase()===meName){ myIdx=k; myEntry=list[k]; break; }
    }
  }
  el.innerHTML='';
  var display=list.slice(0,15);
  if(!display.length){
    var d=document.createElement('div');d.className='rank-full-empty';
    d.textContent='Sin resultados';el.appendChild(d);return;
  }
  function buildRow(entry, posLabel, medalIdx, isMe, grey){
    var row=document.createElement('div');row.className='rank-full-row'+(isMe?' rank-full-me':'')+(isMe&&grey?' me-grey':'');
    var pos=document.createElement('div');
    pos.className='rank-full-pos'+(medalIdx>=0 && medalIdx<3?' '+medals[medalIdx]:'');
    pos.textContent=posLabel;
    var nm=document.createElement('div');nm.className='rank-full-name';nm.textContent=entry.name;
    var ms=document.createElement('div');ms.className='rank-full-ms';
    ms.textContent=(m==='limite') ? ((entry.ensayos||0)+'/'+entry.avg) : (entry.avg+' ms');
    var dt=document.createElement('div');dt.className='rank-full-date';dt.textContent=entry.ts?fmtDate(entry.ts):'';
    row.appendChild(pos);row.appendChild(nm);row.appendChild(ms);row.appendChild(dt);
    return row;
  }
  for(var i=0;i<display.length;i++){
    var rowName=(display[i].name||'').trim().toUpperCase();
    var isMe=meName && rowName===meName;
    el.appendChild(buildRow(display[i], (i+1), i, isMe));
  }
  if(myEntry && myIdx>=15){
    var posLabel=(myIdx+1>=100)?'100+':String(myIdx+1);
    el.appendChild(buildRow(myEntry, posLabel, -1, true));
  }
  if(latest){
    var shownTs={};
    for(var s2=0;s2<display.length;s2++){ if(display[s2].ts!=null) shownTs[display[s2].ts]=1; }
    var bestExtra=(myEntry && myIdx>=15 && myEntry.ts===latest.ts);
    if(!shownTs[latest.ts] && !bestExtra){
      var lpos=1;
      for(var q=0;q<list.length;q++){ if(rankBetter(list[q], latest)) lpos++; }
      var greyLatest=!!(myEntry && myIdx<15 && rankBetter(myEntry, latest));
      el.appendChild(buildRow(latest, (lpos>=100?'100+':String(lpos)), -1, true, greyLatest));
    }
  }
}

var rankUnsub=null;

  return (list||[]).filter(function(r){ return set[(r.name||'')+'|'+(r.ts||r.date||'')]; });

function mergeRank(globalRows,localRows){
  var out=[], seen={};
  (globalRows||[]).concat(localRows||[]).forEach(function(r){

<script type="module">

/* Sin persistencia offline (2026-09-28): initializeFirestore con
   persistentLocalCache+persistentMultipleTabManager puede quedarse
   esperando un candado entre pestanas/sesiones que nunca se libera --
   reportado por el usuario: el ranking se quedaba mostrando solo lo local
   de este dispositivo, y NO se arreglaba ni cerrando y reabriendo la app
   (el candado vive en IndexedDB, no en memoria). El guardado local
   (localStorage, ver saveScore()) sigue funcionando igual sin conexion;
   lo unico que se pierde es la cola de reintento automatico de Firestore
   cuando no hay red -- si falla el guardado en la nube, se queda solo en
   local hasta que se vuelva a intentar desde esta app. Mismo fix ya

let db=null;

/* Cola de reintento offline (2026-09-28, propia, en localStorage):
   ya no hay persistencia de Firestore (ver nota arriba), asi que si
   fbSave falla o no hay red, la marca se guarda aqui y se reintenta
   sola al recuperar conexion (evento 'online' + al volver a primer
   plano). No usa IndexedDB ni el motor offline de Firestore -> no
   puede reproducir el candado entre pestanas del Paso H. */
var PENDING_KEY='rds_pc2_pending';
function loadPending(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY)||'[]'); }catch(e){ return []; } }
function savePending(arr){ try{ localStorage.setItem(PENDING_KEY, JSON.stringify(arr)); }catch(e){} }
function updatePendingUI(){
  var n=loadPending().length, el=document.getElementById('pending-sync');
  if(!el) return;
  if(n>0){ el.style.display='block'; el.textContent='⚠ '+n+(n===1?' marca pendiente de subir':' marcas pendientes de subir'); }
  else{ el.style.display='none'; el.textContent=''; }
}
function withTimeout(p,ms){
  return new Promise(function(resolve,reject){
    var done=false, t=setTimeout(function(){ if(!done){ done=true; reject(new Error('timeout')); } }, ms);
    p.then(function(v){ if(!done){ done=true; clearTimeout(t); resolve(v); } }, function(e){ if(!done){ done=true; clearTimeout(t); reject(e); } });
  });
}
var flushing=false;
async function flushPending(){
  if(!db || flushing || !navigator.onLine) return;

  for(var i=0;i<pend.length;i++){
    try{ await withTimeout(addDoc(collection(db,'scores_perception2'), pend[i]), 8000); }
    catch(e){ rest.push(pend[i]); }
  }

/* Red de seguridad (2026-10-01): garantiza que NINGUNA marca guardada en este dispositivo
   se quede sin llegar al ranking global. Cada marca se guarda siempre en local; si por lo
   que sea (fallo de envio con la app cerrada, SDK sin cargar offline, version antigua sin
   cola...) no llego a subir ni esta en la cola, esta pasada la encuentra y la encola.
   Al abrir la app con red (y al recuperarla), como mucho cada 6 h: se comprueban las marcas
   locales aun no verificadas contra Firestore (1 consulta por nombre, solo lectura) y las
   que faltan se anaden a la cola de pendientes (que ya sabe subirlas). Si cualquier
   comprobacion falla NO se sube nada (evita duplicados). Las verificadas se recuerdan para
   no repetir lecturas. */
var RECON_PFX='rds_pc2_', RECON_COL='scores_perception2';
function reconKey(r){ return (r.name||'')+'|'+(r.ts||r.date||''); }
function reconOk(r){ return r && r.name && typeof r.ts==='number' && r.mode!==undefined && r.stim!==undefined && r.total!==undefined; }
function reconCollect(){
  var out=[];
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!k || k.indexOf(RECON_PFX)!==0 || /rankcache|pending|recon|legacy|_ts$/.test(k)) continue;
      var arr; try{ arr=JSON.parse(localStorage.getItem(k)); }catch(e){ continue; }
      if(!Array.isArray(arr)) continue;
      arr.forEach(function(r){ if(reconOk(r)) out.push(r); });
    }
  }catch(e){}
  return out;
}
async function reconcileOrphans(force, dry){
  try{
    if(!db || !navigator.onLine) return null;
    var now=Date.now(), TS=RECON_PFX+'recon_ts', OK=RECON_PFX+'recon_ok';
    if(!force && now-(+localStorage.getItem(TS)||0) < 6*3600*1000) return null;
    var ok={}; try{ ok=JSON.parse(localStorage.getItem(OK)||'{}')||{}; }catch(e){ ok={}; }
    var pend={}; loadPending().forEach(function(q){ pend[reconKey(q)]=1; });
    var seen={}, cands=[];
    reconCollect().forEach(function(r){
      var k=reconKey(r); if(seen[k] || ok[k] || pend[k]) return; seen[k]=1;
      if(now-(r.ts||r.date||0) < 120000) return;   // recien guardada: puede estar subiendose ahora mismo
      cands.push(r);
    });
    if(!cands.length){ if(!dry) localStorage.setItem(TS,String(now)); return {cands:0, add:[]}; }
    var names={}; cands.forEach(function(r){ names[r.name]=1; });
    var have={};
    for(var nm in names){
      var snap=await withTimeout(getDocs(query(collection(db,RECON_COL), where('name','==',nm))), 12000);   // si falla, lanza: no se sube nada
      snap.forEach(function(d){ have[reconKey(d.data())]=1; });
    }
    var add=[];
    cands.forEach(function(r){ var k=reconKey(r); if(have[k]) ok[k]=1; else add.push(r); });
    if(dry) return {cands:cands.length, add:add};
    add.forEach(function(r){ ok[reconKey(r)]=1; });   // quedan en la cola: no volver a consultarlas
    var ks=Object.keys(ok); if(ks.length>3000){ var n2={}; ks.slice(ks.length-3000).forEach(function(k){ n2[k]=1; }); ok=n2; }
    if(add.length){ savePending(loadPending().concat(add)); updatePendingUI(); }
    localStorage.setItem(OK,JSON.stringify(ok)); localStorage.setItem(TS,String(now));
    if(add.length) flushPending();
    return {cands:cands.length, add:add};
  }catch(e){ return null; }
}

/* ===== Ranking INCREMENTAL (2-oct-2026): ahorra lecturas de Firestore =====

/* v+ (2026-10-12): SEMILLA ESTATICA. Un proceso de GitHub (repo rds-rankings-data) publica en GitHub Pages el JSON completo de cada ranking (cada ~15 min). En vez de

var STATIC_BASE=(location.hostname==='localhost'||location.hostname==='127.0.0.1') ? '/rds-rankings-data/data/' : 'https://rdsk27.github.io/rds-rankings-data/data/';
var STATIC_COLS=['scores_ballcoordination','scores_circuit','scores_gimnasia','scores_lights','scores_memorycards','scores_perception','scores_processing','scores_processing2','scores_rallymemory','scores_reactionkarate','scores_reactiontenis','scores_reactiontrial','scores_perception2','scores_reaction_10_normal_press_nosound','scores_reaction_10_normal_press_sound'];
function mkInc(COL,TSF,KEY,STRIP){
  var HAS_JSON=STATIC_COLS.indexOf(COL)>=0, WEEK=7*864e5, AGE=HAS_JSON?12*36e5:WEEK, MARGIN=(HAS_JSON?1:6)*36e5, c={docs:{},full:0,ts:0}, loaded=false;
  function load(){ if(loaded) return; loaded=true; try{ var o=JSON.parse(localStorage.getItem(KEY)||'null'); if(o&&o.docs&&typeof o.docs==='object') c=o; }catch(e){} }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(c)); }catch(e){} }
  function strip(r){ if(STRIP&&r&&r[STRIP]!==undefined) delete r[STRIP]; return r; }
  function put(id,r){ c.docs[id]=r; var t=r&&r[TSF]; if(typeof t==='number'&&t>c.ts&&t<=Date.now()+36e5) c.ts=t; }
  function rows(f){ var out=[],id,r; for(id in c.docs){ r=c.docs[id]; if(!f||f(r)) out.push(r); } return out; }
  function need(){ return !c.full||Date.now()-c.full>AGE||!Object.keys(c.docs).length; }
  function tailQ(){ return query(collection(db,COL), where(TSF,'>=',Math.max(0,c.ts-MARGIN))); }
  function seed(){
    return fetch(STATIC_BASE+COL+'.json', {cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('json'); return r.json(); }).then(function(j){
      if(!j || j.v!==1 || !Array.isArray(j.docs) || !j.docs.length) throw new Error('json');
      c.docs={}; c.ts=0;
      j.docs.forEach(function(d){ var id=d.id; delete d.id; put(id,strip(d)); });
      c.full=Date.now(); save();
    });
  }
  function fullLoad(){
    if(!HAS_JSON) return dbFull();
    return seed().catch(function(){
      if(Object.keys(c.docs).length){ c.full=Date.now()-AGE+30*6e4; save(); return; }   // hay copia local: sin lectura completa; reintento en 30 min
      return dbFull();
    });
  }
  function dbFull(){ return getDocs(collection(db,COL)).then(function(snap){ c.docs={}; c.ts=0; snap.forEach(function(d){ put(d.id,strip(d.data())); }); c.full=Date.now(); save(); }); }
  return {
    watch:function(f,cb,errCb){
      if(!db) return null; load();
      var unsub=null, dead=false;
      if(Object.keys(c.docs).length){ try{ cb(rows(f)); }catch(e){} }
      function listen(){
        if(dead) return;
        try{
          unsub=onSnapshot(tailQ(), { includeMetadataChanges:true }, function(snap){
            if(snap.metadata.fromCache) return;   // sin servidor no hay datos reales: no pisar la copia guardada
            snap.docChanges().forEach(function(ch){ if(ch.type==='removed') delete c.docs[ch.doc.id]; else put(ch.doc.id,strip(ch.doc.data())); });
            save(); cb(rows(f));
          }, function(){ if(errCb){ try{ errCb(); }catch(e){} } });
        }catch(e){}
      }
      if(need()){ fullLoad().then(function(){ if(dead) return; cb(rows(f)); listen(); }).catch(function(){ if(errCb){ try{ errCb(); }catch(e){} } }); }
      else listen();
      return function(){ dead=true; if(unsub){ try{ unsub(); }catch(e){} unsub=null; } };
    },
    load:async function(f){
      if(!db) return null; load();
      try{
        if(need()) await fullLoad();
        else { var snap=await getDocs(tailQ()); snap.forEach(function(d){ put(d.id,strip(d.data())); }); save(); }
        return rows(f);
      }catch(e){ return null; }
    }
  };
}
var RINC=mkInc('scores_perception2','ts','rds_pc2_inc'); window.rdsPrepare=async function(){var rows=await RINC.load(null);if(rows===null)return false;try{var g={};rows.forEach(function(r){var k=[r.mode,r.stim,r.total];var s=JSON.stringify(k);(g[s]=g[s]||{k:k,rows:[]}).rows.push(r);});Object.keys(g).forEach(function(s){var o=g[s];saveRankCache(rankCacheKey(o.k[0],o.k[1],o.k[2]),o.rows);});}catch(e){return false;}return true;};
window.fbWatch=function(mode,stim,total,cb){
  if(!db) return null;
  try{ return RINC.watch(function(r){ return r.mode===mode&&r.stim===stim&&r.total===total; }, cb); }catch(e){ return null; }
};
window.fbLoad=async function(mode,stim,total){
  if(!db) return null;
  return RINC.load(function(r){ return r.mode===mode&&r.stim===stim&&r.total===total; });
};
</script>

  <div id="transition-text">Ejercicio finalizado</div>
</div>
